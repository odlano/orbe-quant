
name: Testes ORBE QUANT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Executar testes
        run: python -m unittest discover -p "teste_orbe.py" -v
